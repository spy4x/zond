# Staged stack for the zond demo video: zond, built from this checkout by record.sh, plus tiny
# stand-in services. hl-metube and hl-ollama are traefik/whoami, which answers 200 on any path.
# hl-grafana is in the "down" profile, so `docker compose up -d` leaves it stopped and zond reports
# it KO, like the README's real run.
name: zond-demo
services:
  zond:
    image: zond-demo/zond:local
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./zond.yml:/app/zond.yml:ro,z"]
  hl-metube:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    command: ["--port", "8081"]
  hl-ollama:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    command: ["--port", "11434"]
  hl-grafana:
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    command: ["--port", "3000"]
    profiles: ["down"]
